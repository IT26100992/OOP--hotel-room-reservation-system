<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Management</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 1100px;
            margin: auto;
        }
        section {
            background: white;
            padding: 24px;
            margin: 20px 0;
            border-radius: 12px;
        }
        h1, h2 { color: #1d4ed8; }
        form {
            display: grid;
            gap: 16px;
            max-width: 500px;
        }
        label { display: grid; gap: 8px; }
        input, select, button {
            padding: 10px;
            font: inherit;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: default; }
        .table-container { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        td button, td a {
            display: inline-block;
            margin: 4px;
        }
        #message { white-space: pre-wrap; }
        .error { color: #b91c1c; }
        .success { color: #166534; }
    </style>
</head>
<body>
<main>
    <h1>Payment Management</h1>
    <a href="/index.html">Back to Home</a>

    <p id="message" role="status" aria-live="polite"></p>

    <section>
        <h2>Create Payment</h2>
        <p>Create a pending payment for an existing reservation.</p>

        <form id="payment-form">
            <label>
                Reservation ID
                <input id="reservation-id" type="text" required>
            </label>

            <label>
                Amount
                <input id="amount" type="number"
                       min="0.01" step="0.01" required>
            </label>

            <label>
                Payment Method
                <select id="method">
                    <option value="CASH">Cash</option>
                    <option value="BANK_TRANSFER">Bank Transfer</option>
                    <option value="CARD">Card</option>
                </select>
            </label>

            <button id="create-button" type="submit">
                Create Pending Payment
            </button>
        </form>

        <p>Payment processing is simulated for this university project.</p>
    </section>

    <section>
        <h2>Payment History</h2>
        <button id="refresh-button" type="button">Refresh Payments</button>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Payment ID</th>
                    <th>Reservation</th>
                    <th>Amount</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="payment-rows"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const form = document.getElementById("payment-form");
    const rows = document.getElementById("payment-rows");
    const message = document.getElementById("message");
    const createButton = document.getElementById("create-button");
    const refreshButton = document.getElementById("refresh-button");

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = isError ? "error" : "success";
    }

    async function request(url, options = {}) {
        const response = await fetch(url, options);
        const text = await response.text();

        let data;
        try {
            data = text ? JSON.parse(text) : null;
        } catch {
            throw new Error("The server returned an unexpected response.");
        }

        if (!response.ok) {
            throw new Error(
                data?.error || data?.message || "Request failed."
            );
        }

        return data;
    }

    function addCell(row, value) {
        const cell = document.createElement("td");
        cell.textContent = String(value ?? "");
        row.appendChild(cell);
        return cell;
    }

    async function loadPayments() {
        const payments = await request("/api/payments");
        rows.replaceChildren();

        if (payments.length === 0) {
            const row = document.createElement("tr");
            const cell = addCell(row, "No payments found.");
            cell.colSpan = 6;
            rows.appendChild(row);
            return;
        }

        for (const payment of payments) {
            const row = document.createElement("tr");

            addCell(row, payment.id);
            addCell(row, payment.reservationId);
            addCell(row, Number(payment.amount).toFixed(2));
            addCell(row, payment.method);
            addCell(row, payment.status);

            const actions = document.createElement("td");

            if (payment.status === "PENDING") {
                const processButton = document.createElement("button");
                processButton.type = "button";
                processButton.textContent = "Process Payment";

                processButton.addEventListener("click", async () => {
                    processButton.disabled = true;

                    try {
                        await request(
                            "/api/payments/"
                            + encodeURIComponent(payment.id)
                            + "/process",
                            { method: "POST" }
                        );

                        showMessage(
                            "Payment " + payment.id + " completed."
                        );

                        try {
                            await loadPayments();
                        } catch {
                            showMessage(
                                "Payment completed, but the list could not "
                                + "refresh. Click Refresh Payments.",
                                true
                            );
                        }
                    } catch (error) {
                        showMessage(error.message, true);
                    } finally {
                        processButton.disabled = false;
                    }
                });

                actions.appendChild(processButton);
            }

            if (payment.status === "COMPLETED") {
                const receiptLink = document.createElement("a");
                receiptLink.textContent = "View Receipt";
                receiptLink.href = "/receipt.html?paymentId="
                    + encodeURIComponent(payment.id);
                actions.appendChild(receiptLink);
            }

            row.appendChild(actions);
            rows.appendChild(row);
        }
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const reservationId =
            document.getElementById("reservation-id").value.trim();

        if (!reservationId) {
            showMessage("Reservation ID is required.", true);
            return;
        }

        createButton.disabled = true;

        try {
            const payment = await request("/api/payments", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    reservationId,
                    amount: document.getElementById("amount").value,
                    method: document.getElementById("method").value
                })
            });

            showMessage("Pending payment created: " + payment.id);
            form.reset();

            try {
                await loadPayments();
            } catch {
                showMessage(
                    "Payment created: " + payment.id
                    + ". Click Refresh Payments to reload the list.",
                    true
                );
            }
        } catch (error) {
            showMessage(error.message, true);
        } finally {
            createButton.disabled = false;
        }
    });

    refreshButton.addEventListener("click", async () => {
        refreshButton.disabled = true;
        try {
            await loadPayments();
            showMessage("Payment list refreshed.");
        } catch (error) {
            showMessage(error.message, true);
        } finally {
            refreshButton.disabled = false;
        }
    });

    loadPayments().catch(error => showMessage(error.message, true));
</script>
</body>
</html>
