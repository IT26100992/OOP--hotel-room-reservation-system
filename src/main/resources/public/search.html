
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Available Rooms | Hotel Reservation</title>

    <link rel="stylesheet" href="/css/search.css">
    <script src="/js/search.js" defer></script>
</head>
<body>

<header class="header">
    <h1>Hotel Room Reservation</h1>
    <p>Find the perfect room for your stay</p>
</header>

<main class="container">

    <section class="search-section">
        <h2>Search Available Rooms</h2>

        <form id="searchForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="checkIn">Check-in Date</label>
                    <input type="date" id="checkIn" required>
                </div>

                <div class="form-group">
                    <label for="checkOut">Check-out Date</label>
                    <input type="date" id="checkOut" required>
                </div>

                <div class="form-group">
                    <label for="guests">Number of Guests</label>
                    <input type="number" id="guests"
                           min="1" value="2" required>
                </div>

                <div class="form-group">
                    <label for="roomType">Room Type</label>

                    <select id="roomType">
                        <option value="">All Room Types</option>
                        <option value="SINGLE">Single</option>
                        <option value="DOUBLE">Double</option>
                        <option value="TWIN">Twin</option>
                        <option value="DELUXE">Deluxe</option>
                        <option value="SUITE">Suite</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="minPrice">Minimum Price (LKR)</label>
                    <input type="number" id="minPrice"
                           min="0" step="0.01"
                           placeholder="Optional">
                </div>

                <div class="form-group">
                    <label for="maxPrice">Maximum Price (LKR)</label>
                    <input type="number" id="maxPrice"
                           min="0" step="0.01"
                           placeholder="Optional">
                </div>

            </div>

            <button type="submit" class="search-button">
                Search Rooms
            </button>

        </form>
    </section>


    <section class="saved-search-section">

        <h2>My Saved Searches</h2>

        <p>
            Save your search conditions to use them again later.
        </p>


        <div class="saved-actions">
            <button type="button" id="saveSearchBtn">
                Save Current Search
            </button>

            <button type="button" id="loadSavedSearchesBtn">
                View Saved Searches
            </button>


            <button type="button" id="updateSearchBtn" hidden>
                Update Saved Search
            </button>

            <button type="button" id="cancelEditBtn" hidden>
                Cancel Editing
            </button>

        </div>

        <p id="savedSearchMessage"
           role="status"
           aria-live="polite"></p>

        <div id="savedSearchResults"></div>

    </section>


    <section class="results-section">
        <h2>Available Rooms</h2>

        <p id="message" role="status" aria-live="polite">
            Enter your search criteria to find available rooms.
        </p>

        <div id="roomResults" class="room-grid"></div>
    </section>

</main>

</body>
</html>
