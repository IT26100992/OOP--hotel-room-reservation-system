<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In | Hotel Reservation</title>

    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/login.js" defer></script>
</head>

<body>

<main class="auth-layout">

    <section class="auth-visual">
        <div class="visual-content">
            <span class="brand">HOTEL RESERVATION</span>

            <h1>Welcome back.</h1>

            <p>
                Sign in to explore available rooms,
                manage your reservations and
                enjoy your next hotel stay.
            </p>
        </div>
    </section>

    <section class="auth-panel">

        <div class="auth-card">

            <div class="mobile-brand">
                HOTEL RESERVATION
            </div>

            <h2>Sign in to your account</h2>

            <p class="subtitle">
                Enter your credentials to continue.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email Address
                    </label>

                    <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">
                        <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                        <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle">
                            Show
                        </button>
                    </div>
                </div>

                <div
                        id="formMessage"
                        class="form-message"
                        role="status"
                        aria-live="polite">
                </div>

                <button
                        type="submit"
                        id="loginButton"
                        class="primary-button">
                    Sign In
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="/register.html">
                    Create an account
                </a>
            </p>

        </div>

    </section>

</main>

</body>
</html>
