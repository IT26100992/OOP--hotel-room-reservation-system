<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | Hotel Reservation</title>

    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/profile.js" defer></script>
</head>

<body>

<main class="profile-layout">

    <header class="profile-header">
        <a class="profile-brand" href="/search.html">
            HOTEL RESERVATION
        </a>

        <nav class="profile-nav">
            <a href="/search.html">Search Rooms</a>
            <button id="logoutButton" type="button">
                Logout
            </button>
        </nav>
    </header>

    <section class="profile-container">

        <div class="profile-heading">
            <h1>My Profile</h1>
            <p>View and manage your account information.</p>
        </div>

        <div class="profile-card">

            <div class="profile-summary">
                <div class="profile-avatar" aria-hidden="true">
                    <span id="userInitial">?</span>
                </div>

                <div>
                    <h2 id="displayName">Loading...</h2>
                    <p id="displayEmail">Please wait</p>
                </div>
            </div>

            <div class="profile-details">

                <div class="detail-item">
                    <span>Full Name</span>
                    <strong id="detailName">—</strong>
                </div>

                <div class="detail-item">
                    <span>Email Address</span>
                    <strong id="detailEmail">—</strong>
                </div>

                <div class="detail-item">
                    <span>Phone Number</span>
                    <strong id="detailPhone">—</strong>
                </div>

                <div class="detail-item">
                    <span>Account Role</span>
                    <strong id="detailRole">—</strong>
                </div>

            </div>

            <button type="button"
                    id="editButton"
                    class="primary-button">
                Edit Profile
            </button>

        </div>

        <div id="editSection" class="profile-card" hidden>

            <h2>Edit Information</h2>

            <form id="profileForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text"
                           id="fullName"
                           maxlength="100"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email"
                           id="email"
                           maxlength="254"
                           required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone">
                </div>

                <div class="profile-actions">
                    <button type="submit"
                            id="saveButton"
                            class="primary-button">
                        Save Changes
                    </button>

                    <button type="button"
                            id="cancelButton"
                            class="secondary-button">
                        Cancel
                    </button>
                </div>

            </form>

        </div>

        <div id="profileMessage"
             class="form-message"
             role="status"
             aria-live="polite"></div>

        <section class="danger-zone">

            <h2>Account Management</h2>

            <p>
                Deactivating your account will prevent you
                from signing in again.
            </p>

            <button type="button"
                    id="deactivateButton"
                    class="danger-button">
                Deactivate Account
            </button>

        </section>

    </section>

</main>

</body>
</html>
